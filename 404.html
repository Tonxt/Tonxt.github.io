<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada — Lisandro Acuña</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#221a26" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" />
  <link rel="stylesheet" href="/identidad/tokens.css?v=14" />
  <style>
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; text-align: center;
      background: var(--ink); color: var(--paper);
      font-family: var(--font); padding: 2rem; -webkit-font-smoothing: none;
    }
    .code { color: var(--sun); font-size: 20px; margin: 0; }
    h1 { font-size: clamp(40px, 8vw, 64px); font-weight: 700; line-height: 1; margin: 12px 0; text-shadow: 4px 4px 0 var(--wall); }
    p.msg { color: var(--text-inv-2); margin: 0 0 32px; font-size: 19px; }
    a.home {
      display: inline-block; font-weight: 600; font-size: 18px; text-decoration: none;
      background: var(--orange); color: var(--ink); padding: 10px 20px;
      box-shadow: 0 -4px 0 0 var(--paper), 0 4px 0 0 var(--paper), -4px 0 0 0 var(--paper), 4px 0 0 0 var(--paper), 0 8px 0 0 var(--red);
    }
    a.home:hover { transform: translateY(-4px); }
    a.home:focus-visible { outline: 3px dashed var(--orange); outline-offset: 6px; }
  </style>
</head>
<body>
  <main>
    <p class="code">Error 404</p>
    <h1>Página no encontrada</h1>
    <p class="msg">Este cuarto está vacío. La página que buscás no existe o se movió.</p>
    <a class="home" href="/">Volver al inicio</a>
  </main>
</body>
</html>
